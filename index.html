    <link rel="icon" href="IMG-20260814-WA0019.jpg" type="image/jpeg">

    <style>
        body {
            background-image: url('IMG-20260814-WA0019.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ca8a04; border-radius: 10px; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); filter: drop-shadow(0 0 35px rgba(202, 138, 4, 1)); }
            100% { transform: translateY(0px); }
        }
        .floating-award {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.8) translateY(30px); opacity: 0; }
            80% { transform: scale(1.05) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(202, 138, 4, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(202, 138, 4, 1); transform: scale(1.02); }
            100% { box-shadow: 0 0 10px rgba(202, 138, 4, 0.5); transform: scale(1); }
        }
        .btn-active-pulse {
            animation: pulseGlow 2s infinite;
        }
    </style>

        let votes = {};

        const categoriesGrid = document.getElementById('categories-grid');
        const countNumber = document.getElementById('count-number');
        const proceedBtn = document.getElementById('proceed-btn');
        const authModal = document.getElementById('auth-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const finalSubmitBtn = document.getElementById('final-submit-btn');
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');

        // Fetch overrides before displaying categories
        async function initializeAppWithOverrides() {
            try {
                const configRef = doc(db, 'config', 'nominee_edits');
                const configSnap = await getDoc(configRef);
                if (configSnap.exists()) {
                    const overrides = configSnap.data();
                    for (const cat in overrides) {
                        for (const idx in overrides[cat]) {
                            NOMINEES[cat][idx] = overrides[cat][idx];
                        }
                    }
                }
            } catch (error) {
                console.warn("Could not check for overrides. Loading default database.", error);
            }
            
            document.getElementById('loading-categories').classList.add('hidden');
            categoriesGrid.classList.remove('hidden');
            renderCategories();
        }

        function renderCategories() {
            CATEGORIES.forEach((cat, idx) => {
                const nomineesList = NOMINEES[cat] || [];
                
                let optionsHTML = `<option value="" disabled selected>Tap to select...</option>`;
                nomineesList.forEach(nominee => {
                    optionsHTML += `<option value="${nominee}">${nominee}</option>`;
                });

                const card = document.createElement('div');
                card.className = "border border-gray-800 p-4 md:p-5 rounded-xl bg-black/70 backdrop-blur-sm hover:border-yellow-500 hover:bg-black/90 transition-all duration-300 shadow-lg group";
                card.innerHTML = `
                    <div class="flex items-center mb-3">
                        <span class="bg-yellow-600/20 text-yellow-500 font-bold w-6 h-6 md:w-8 md:h-8 flex items-center justify-center rounded-full mr-2 text-xs md:text-sm group-hover:bg-yellow-500 group-hover:text-black transition-colors">${idx + 1}</span>
                        <h3 class="font-bold text-gray-200 text-sm md:text-base leading-tight">${cat}</h3>
                    </div>
                    <select class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white text-sm md:text-base focus:border-yellow-500 focus:ring-1 focus:ring-yellow-500 outline-none category-select shadow-inner cursor-pointer appearance-none" data-category="${cat}">
                        ${optionsHTML}
                    </select>
                `;
                categoriesGrid.appendChild(card);
            });

            document.querySelectorAll('.category-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const category = e.target.getAttribute('data-category');
                    const value = e.target.value;
                    
                    if (value) {
                        votes[category] = value;
                        e.target.classList.add('border-yellow-500', 'bg-black');
                    } else {
                        delete votes[category];
                        e.target.classList.remove('border-yellow-500', 'bg-black');
                    }
                    updateSubmitButton();
                });
            });
        }

        function updateSubmitButton() {
            const currentVotes = Object.keys(votes).length;
            countNumber.innerText = currentVotes;
            
            if (currentVotes === CATEGORIES.length) {
                proceedBtn.disabled = false;
                proceedBtn.innerText = "PROCEED TO SUBMIT 🚀";
                proceedBtn.className = "w-full md:w-auto bg-gradient-to-r from-yellow-500 to-yellow-600 text-black font-black py-3 md:py-4 px-8 md:px-12 rounded-xl text-sm md:text-base uppercase tracking-widest btn-active-pulse hover:scale-105 transition-transform cursor-pointer";
            } else {
                proceedBtn.disabled = true;
                proceedBtn.innerText = "COMPLETE ALL CATEGORIES";
                proceedBtn.className = "w-full md:w-auto bg-gray-800 text-gray-500 font-bold py-3 md:py-4 px-8 md:px-12 rounded-xl text-sm md:text-base uppercase tracking-widest cursor-not-allowed";
            }
        }

        proceedBtn.addEventListener('click', () => {
            authModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            authModal.classList.add('hidden');
            errorMsg.classList.add('hidden');
        });

        finalSubmitBtn.addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const matric = document.getElementById('matric-input').value.trim();

            if (!email || !matric) {
                errorText.innerText = "Both fields are required.";
                errorMsg.classList.remove('hidden');
                return;
            }

            const hasValidCode = VALID_CODES.some(code => matric.includes(code));
            if (!hasValidCode) {
                errorText.innerText = "Invalid Student ID. Approved faculty code missing.";
                errorMsg.classList.remove('hidden');
                return;
            }

            finalSubmitBtn.innerHTML = '<span class="animate-pulse">Processing...</span>';
            finalSubmitBtn.disabled = true;

            try {
                const voterRef = doc(db, 'voters', matric);
                const voterSnap = await getDoc(voterRef);

                if (voterSnap.exists()) {
                    errorText.innerText = "Access Denied: This ID has already voted.";
                    errorMsg.classList.remove('hidden');
                    finalSubmitBtn.innerHTML = '🔥 CAST MY VOTE!';
                    finalSubmitBtn.disabled = false;
                    return;
                }

                const voteId = Date.now().toString();
                await setDoc(doc(db, 'votes', voteId), {
                    matric: matric,
                    email: email,
                    timestamp: new Date(),
                    selections: votes
                });

                await setDoc(doc(db, 'voters', matric), { 
                    votedAt: new Date(),
                    email: email 
                });

                alert("🎉 SUCCESS! Your votes for The Regency Gala are locked in!");
                window.location.reload();

            } catch (error) {
                errorText.innerText = "Connection failed. Check your internet.";
                errorMsg.classList.remove('hidden');
                finalSubmitBtn.innerHTML = '🔥 CAST MY VOTE!';
                finalSubmitBtn.disabled = false;
            }
        });

        // Start App
        initializeAppWithOverrides();

    </script>
